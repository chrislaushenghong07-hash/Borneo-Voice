<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borneo-Voice Melanau Mukah Translator</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入开源图像 OCR 识别库 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <!-- 顶部导航栏与账号登录区 -->
    <header class="app-header">
        <div class="header-left">
            <img src="logo.png" alt="Logo" class="logo">
            <h1>Borneo-Voice</h1>
        </div>
        <div class="user-auth-area">
            <span id="user-display">未登录</span>
            <button id="open-auth-btn" class="auth-btn">注册 / 登录</button>
            <button id="logout-btn" class="auth-btn logout" style="display: none;">退出登录</button>
        </div>
    </header>

    <!-- 语言选择区 -->
    <div class="lang-bar">
        <label for="source-lang">选择源语言:</label>
        <select id="source-lang">
            <option value="zh">中文 (Chinese)</option>
            <option value="ms">Malay (马来语)</option>
            <option value="en">English (英语)</option>
        </select>
    </div>

    <!-- 选项卡导航 -->
    <nav class="tab-nav">
        <button class="tab-btn active" data-tab="text-tab">📝 文本翻译</button>
        <button class="tab-btn" data-tab="camera-tab">📷 拍照/图片翻译</button>
        <button class="tab-btn" data-tab="voice-tab">🎙️ 语音对话翻译</button>
    </nav>

    <main class="content-container">
        <!-- 1. 文本翻译板块 -->
        <section id="text-tab" class="tab-content active">
            <div class="translator-box">
                <textarea id="source-text" placeholder="请输入要翻译的词汇或句子..."></textarea>
                <button id="translate-btn" class="primary-btn">翻译为 Melanau 语</button>
                <textarea id="target-text" readonly placeholder="Melanau 翻译结果..."></textarea>
                <button id="copy-btn" class="secondary-btn">复制结果</button>
            </div>
        </section>

        <!-- 2. 图片 OCR 翻译板块 -->
        <section id="camera-tab" class="tab-content">
            <div class="camera-box">
                <label for="image-upload" class="upload-btn">📁 选择/拍摄图片</label>
                <input type="file" id="image-upload" accept="image/*">
                <textarea id="camera-result" readonly placeholder="上传图片后，系统将自动识别图片中的文字并翻译..."></textarea>
            </div>
        </section>

        <!-- 3. 语音对话板块 -->
        <section id="voice-tab" class="tab-content">
            <div class="voice-box">
                <button id="mic-source-btn" class="mic-btn">🎤 点击开始说话</button>
                <div id="chat-history" class="chat-history-box"></div>
            </div>
        </section>
    </main>

    <!-- 注册与登录弹窗 -->
    <div id="auth-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="close-modal" class="close-btn">&times;</span>
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab-btn active">登录</button>
                <button id="tab-register" class="auth-tab-btn">注册账号</button>
            </div>

            <!-- 登录表单 -->
            <form id="login-form">
                <input type="text" id="login-username" placeholder="请输入用户名" required>
                <input type="password" id="login-password" placeholder="请输入密码" required>
                <button type="submit" class="primary-btn">登录</button>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" style="display:none;">
                <input type="text" id="reg-username" placeholder="设置用户名" required>
                <input type="password" id="reg-password" placeholder="设置密码" required>
                <button type="submit" class="primary-btn">完成注册</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
