<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borneo Voice - Melanau Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            color: #ffffff;
            padding: 15px;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 1;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .splash-content {
            text-align: center;
            color: #ffffff;
            padding: 20px;
        }

        .splash-logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }

        .splash-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #00aeef;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-size: 13px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-card {
            width: 100%;
            max-width: 700px;
            background: #1e293b;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        header .subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .tab-menu {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-weight: 700;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #00aeef;
            border-bottom-color: #00aeef;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        select {
            flex: 1;
            padding: 10px;
            background: #334155;
            color: white;
            border: 1px solid #475569;
            border-radius: 8px;
            outline: none;
        }

        .arrow {
            color: #00aeef;
            font-weight: bold;
            font-size: 20px;
        }

        .text-boxes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
            @media (min-width: 600px) {
            .text-boxes {
                flex-direction: row;
            }
        }

        .box {
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            resize: none;
            outline: none;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button, .file-label {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 14px;
        }

        .primary-btn {
            background: #00aeef;
            color: #ffffff;
        }

        .secondary-btn {
            background: #334155;
            color: #ffffff;
        }

        button:hover, .file-label:hover {
            opacity: 0.9;
        }

        .placeholder-box {
            padding: 40px 20px;
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 8px;
            text-align: center;
            color: #94a3b8;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.6;
        }

        .chat-box {
            height: 200px;
            overflow-y: auto;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 13px;
        }

        .chat-message.system {
            background: #334155;
            color: #cbd5e1;
            align-self: center;
            text-align: center;
        }

        .chat-message.user {
            background: #00aeef;
            color: white;
            align-self: flex-end;
        }

        .chat-message.melanau {
            background: #10b981;
            color: white;
            align-self: flex-start;
        }
    </style>
</head>

    <div id="splash-screen">

            <h1 class="splash-title">BORNEO VOICE</h1>
            <div class="spinner"></div>

        </div>
    </div>

    <div class="app-card">
        <header>

            </div>
            <p class="subtitle">Borneo Voice - Bahasa Melanau Translator / 密兰诺语翻译助手</p>
        </header>

        <div class="tab-menu">
            <button class="tab-btn active" data-tab="text-tab">Text / 文本</button>
            <button class="tab-btn" data-tab="camera-tab">Camera / 相机</button>
            <button class="tab-btn" data-tab="conversation-tab">Conversation / 对话</button>
        </div>

        <div class="lang-selector">
            <select id="source-lang">

                <option value="zh">Chinese / 华语</option>
                <option value="en">English / 英语</option>
            </select>

            <span class="arrow">➔</span>

            <select id="target-lang" disabled>
                <option value="mel">Melanau(Mukah) / 密兰诺语</option>
            </select>
        </div>
            <div id="text-tab" class="tab-content active">
            <div class="text-boxes">
                <div class="box">

                </div>
                <div class="box">

            <div class="actions">

        </div>

        <div id="camera-tab" class="tab-content">

                <div id="camera-placeholder" class="placeholder-box">

                </div>
            </div>

            <div class="actions">

                    Upload Image / 上传图片
                </label>
                <input type="file" id="image-upload" accept="image/*" style="display: none;">
            </div>
            
            <div class="box" style="margin-top: 15px;">
                <textarea id="camera-result" placeholder="OCR & Translation Result / 识别与翻译结果..." readonly></textarea>
            </div>
        </div>

        <div id="conversation-tab" class="tab-content">
            <div class="chat-box" id="chat-history">

                    💡 Click "Speak Source" to talk.<br>
                    点击下方按键开始进行语音识别。
                </div>
            </div>

            <div class="actions">
                <button id="mic-source-btn" class="primary-btn">🎤 Speak Source / 开始说话</button>
            </div>
        </div>

    </div>

            tabBtns.forEach(btn => {

const sourceText = document.getElementById('source-text');
const targetText = document.getElementById('target-text');
const sourceLang = document.getElementById('source-lang');

function translateWord(text) {
    const cleanText = text.trim().toLowerCase();
    const mode = ${sourceLang.value}-mel;
    const currentDict = dictionary[mode];

    if (currentDict && currentDict[cleanText]) {
        return currentDict[cleanText];
    } else if (currentDict) {
        let words = cleanText.split(" ");
        let translated = words.map(w => currentDict[w]  w);
        return translated.join(" ");
    }
    return "[Word not found / 词库未收录]";
}

document.getElementById('translate-btn').addEventListener('click', () => {
    if (!sourceText.value.trim()) return alert('Please enter text / 请输入内容');
    targetText.value = translateWord(sourceText.value);
});

document.getElementById('copy-btn').addEventListener('click', () => {
    if (targetText.value) {
        navigator.clipboard.writeText(targetText.value);
        alert('Copied! / 已复制！');
    }
});

document.getElementById('start-camera-btn').addEventListener('click', async () => {
    try {
        const webcam = document.getElementById('webcam');
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        webcam.srcObject = stream;
        webcam.style.display = 'block';
        document.getElementById('camera-placeholder').style.display = 'none';
    } catch (err) {
        alert("Camera access denied / 无法访问相机: " + err.message);
    }
});

document.getElementById('image-upload').addEventListener('change', (e) => {
    if (e.target.files[0]) {
        document.getElementById('camera-result').value = `Selected File: ${e.target.files[0].name}\nProcessing OCR...\nResult: apa khabar -> Inou dengah nou?`;
    }
});

const micBtn = document.getElementById('mic-source-btn');
const chatHistory = document.getElementById('chat-history');

if ('webkitSpeechRecognition' in window  'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition  window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();

    micBtn.addEventListener('click', () => {
        const langMap = { ms: 'ms-MY', zh: 'zh-CN', en: 'en-US' };
        recognition.lang = langMap[sourceLang.value]  'en-US';
        recognition.start();
        micBtn.innerText = "Listening... / 正在聆听...";
    });

    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        micBtn.innerText = "🎤 Speak Source / 开始说话";
        
        let userMsg = document.createElement('div');
        userMsg.className = 'chat-message user';
        userMsg.innerText = text;
        chatHistory.appendChild(userMsg);

        let translatedText = translateWord(text);

        let melMsg = document.createElement('div');
        melMsg.className = 'chat-message melanau';
        melMsg.innerText = "Melanau: " + translatedText;
        chatHistory.appendChild(melMsg);

        chatHistory.scrollTop = chatHistory.scrollHeight;
    };

    recognition.onerror = () => {
        micBtn.innerText = "🎤 Speak Source / 开始说话";
        alert("Voice recognition error / 语音识别失败，请检查浏览器权限");
    };
} else {
    micBtn.addEventListener('click', () => {
        alert("Speech recognition is not supported on this browser / 您的浏览器暂不支持语音识别接口");
    });
}
